}

springBoot {
    mainClass = 'com.phenoai.auth.AuthServiceApplication'
}

tasks.named('test') {
    useJUnitPlatform {
        // testes de integração (Testcontainers) só rodam no CI via --no-exclude-tags
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'integration'
        }
    }
}

bootRun {
    def envFile = rootProject.file('../.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def parts = line.split('=', 2)
                environment(parts[0].trim(), parts[1].trim().replaceAll(/^['"]|['"]$/, ''))
            }
        }
    }
}
